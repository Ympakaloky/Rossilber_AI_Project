<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление таблицей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Партии / Продукты / Количество</h1>

    <form id="entry-form" class="entry-form">
      <input type="hidden" id="row-id">
      <div class="form-row">
        <input type="text" id="party" placeholder="Партия" required>
        <input type="text" id="product" placeholder="Продукт" required>
        <input type="number" id="quantity" placeholder="Количество" required>
        <button type="submit" id="submit-btn">Добавить</button>
        <button type="button" id="cancel-edit" class="hidden">Отмена</button>
      </div>
    </form>

    <p id="status-message" class="status"></p>

    <table id="data-table">
      <thead>
        <tr>
          <th>Партия</th>
          <th>Продукт</th>
          <th>Количество</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- строки добавляются через JS -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
